<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RK Admin · Referrals</title>
<style>
:root{font-family:Arial,sans-serif;color:#17172a;background:#f6f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:40px auto;padding:0 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:white;border:1px solid #e6e7ef;border-radius:16px;padding:22px;box-shadow:0 8px 24px #17172a0a;margin:18px 0}h1,h2{margin:0 0 12px}p{color:#666b7d}.field{display:grid;gap:6px;margin:12px 0}input,select{padding:12px;border:1px solid #d9dbe5;border-radius:9px;font:inherit;width:100%}button{border:0;border-radius:9px;padding:11px 16px;background:#7135d7;color:white;font-weight:700;cursor:pointer}button.secondary{background:#eeeaf8;color:#43218b}button.danger{background:#a83248}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:780px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ececf2;font-size:14px}th{color:#666b7d;background:#fafaff}.muted{font-size:13px;color:#777}#notice{margin:10px 0;color:#7135d7}.code{font-weight:700;color:#7135d7}.status{min-width:125px}@media(max-width:600px){.wrap{margin:20px auto}.card{padding:16px}}
</style></head><body><main class="wrap">
<div class="top"><div><h1>RK Web Developer</h1><p>Admin dashboard · Referral management</p></div><div class="row"><button class="secondary" id="refresh" hidden>Refresh</button><button id="logout" class="secondary" hidden>Log out</button></div></div>
<section class="card" id="loginCard"><h2>Admin login</h2><div class="field"><label>Backend API URL</label><input id="apiBase" value="http://localhost:4000/api"></div><div class="field"><label>Username</label><input id="username" autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><button id="login">Sign in</button><div id="notice" role="status"></div></section>
<section class="card hidden" id="dashboard"><div class="top"><div><h2>Referral submissions</h2><p class="muted">Review referrals and update their progress.</p></div><strong id="count">0 referrals</strong></div><div class="table-wrap"><table><thead><tr><th>Code / Date</th><th>Referrer</th><th>Referred person</th><th>Service / Notes</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div><div id="dashNotice" class="muted"></div></section>
</main><script>
const $=id=>document.getElementById(id);let token="";
const api=()=> $('apiBase').value.trim().replace(/\/$/,"");
async function request(path,options={}){const r=await fetch(api()+path,{...options,headers:{"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||"Request failed");return data}
function showDashboard(){ $('loginCard').classList.add("hidden");$('dashboard').classList.remove("hidden");$('refresh').hidden=false;$('logout').hidden=false;loadReferrals()}
async function loadReferrals(){try{const items=await request("/admin/referrals");$('count').textContent=items.length+" referrals";$('rows').innerHTML=items.map(x=>`<tr><td><span class="code">${esc(x.referral_code)}</span><br><span class="muted">${esc(x.created_at)}</span></td><td><b>${esc(x.referrer_name)}</b><br>${esc(x.referrer_phone)}</td><td><b>${esc(x.referred_name)}</b><br>${esc(x.referred_phone)}</td><td>${esc(x.service||"—")}<br><span class="muted">${esc(x.message||"")}</span></td><td><select class="status" data-status="${x.id}">${["new","contacted","converted","rewarded","closed"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select></td><td><button data-save="${x.id}">Save</button> <button class="danger" data-delete="${x.id}">Delete</button></td></tr>`).join("")||'<tr><td colspan="6">No referrals yet.</td></tr>';$('dashNotice').textContent="Loaded successfully."}catch(e){$('dashNotice').textContent=e.message}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$('login').onclick=async()=>{try{const d=await request("/auth/login",{method:"POST",body:JSON.stringify({username:$('username').value,password:$('password').value})});token=d.token;showDashboard()}catch(e){$('notice').textContent=e.message}};
$('refresh').onclick=loadReferrals;
$('logout').onclick=()=>{token="";$('dashboard').classList.add("hidden");$('loginCard').classList.remove("hidden");$('refresh').hidden=true;$('logout').hidden=true};
$('rows').onclick=async e=>{const save=e.target.dataset.save,del=e.target.dataset.delete;try{if(save){const status=document.querySelector(`[data-status="${save}"]`).value;await request(`/admin/referrals/${save}/status`,{method:"PATCH",body:JSON.stringify({status})})}if(del){if(!confirm("Delete this referral permanently?"))return;await request(`/admin/referrals/${del}`,{method:"DELETE"})}if(save||del)loadReferrals()}catch(err){$('dashNotice').textContent=err.message}};
</script></body></html>
